"""Consultation des réservations. Les lectures privées sont réservées au propriétaire ou à un admin."""
type Query {
    """Retourne les réservations d'un utilisateur."""
    get_user_bookings(_id: String!): Booking

    """Retourne toutes les réservations. Requiert un jeton admin."""
    get_all_bookings: [Booking]

    """Retourne les réservations avec les titres récupérés auprès de Movie."""
    get_detailed_user_bookings(_id: String!): [Booking]
}

"""Création et annulation de réservations. Requiert le jeton du propriétaire ou d'un admin."""
type Mutation {
    """Réserve un film uniquement s'il est programmé à cette date."""
    add_booking(_id: String!, date: String!, movieid: String!): Booking

    """Annule un film réservé à une date donnée."""
    del_booking(_id: String!, date: String!, movieid: String!): Booking
}

"""Réservations d'un utilisateur, regroupées par date."""
type Booking {
    userid: String!
    dates: [DateMovie]
}

"""Films réservés pour une date donnée."""
type DateMovie {
    date: String!
    movies: [String!]
}
