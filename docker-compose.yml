services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    environment:
      JWT_SECRET_KEY: jwt-secret-key-for-microservices
    volumes:
      - movie_data:/app/movie/databases

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    restart: unless-stopped
    depends_on:
      - movie
      - schedule
    ports:
      - "127.0.0.1:3201:3201"
    environment:
      JWT_SECRET_KEY: jwt-secret-key-for-microservices
      MOVIE_URL: http://movie:3200
      SCHEDULE_URL: http://schedule:3202
    volumes:
      - booking_data:/app/booking/databases

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3202:3202"
    environment:
      JWT_SECRET_KEY: jwt-secret-key-for-microservices
      MONGODB_URI: mongodb://root:example@mongo:27017/?authSource=admin
      MONGODB_DATABASE: schedule_service

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3203:3203"
    environment:
      JWT_SECRET_KEY: jwt-secret-key-for-microservices
      MONGODB_URI: mongodb://root:example@mongo:27017/?authSource=admin
      MONGODB_DATABASE: user_service

  mongo:
    image: mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo_data:
  movie_data:
  booking_data:

